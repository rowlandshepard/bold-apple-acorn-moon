<script>
const DATA = {"cards":[{"id":"l7-001","lecture":7,"topic":"Plasma membrane","prompt":"What is the most important job of the plasma membrane?","choices":["Define the cell’s border and keep the cell functional","Make most of the cell’s ATP","Store glucose as glycogen","Copy the chromosomes before division"],"answer":0,"why":"The membrane sets the boundary and is selectively permeable. Some materials cross freely. Others need a transporter or a real investment of energy."},{"id":"l7-002","lecture":7,"topic":"Fluid mosaic","prompt":"Which set matches the fluid mosaic model?","choices":["Cellulose, lignin, and pectin only","Phospholipids, cholesterol, proteins, and carbohydrates","DNA, ribosomes, and ATP","Actin filaments with no lipids"],"answer":1,"why":"Lipids (phospholipids and cholesterol), proteins, and carbohydrates on some of those lipids and proteins make the membrane a fluid mosaic."},{"id":"l7-003","lecture":7,"topic":"Fluid mosaic","prompt":"About how is a typical human plasma membrane split by mass?","choices":["90% phospholipid and 10% protein","Equal thirds protein, lipid, and carbohydrate","50% protein, 40% lipid, 10% carbohydrate","Mostly carbohydrate, with a thin lipid coat"],"answer":2,"why":"Proportions vary by cell type. For a typical human cell the lecture uses about 50% protein, 40% lipid, and 10% carbohydrate."},{"id":"l7-004","lecture":7,"topic":"Phospholipids","prompt":"How do phospholipids sit in the bilayer?","choices":["Hydrophobic heads face water; hydrophilic tails face inward","Both heads and tails are hydrophilic","Cholesterol alone forms the entire bilayer","Hydrophilic heads face water; hydrophobic tails face inward"],"answer":3,"why":"Heads are water-loving and tails are water-fearing. That arrangement separates the fluid inside the cell from the fluid outside."},{"id":"l7-005","lecture":7,"topic":"Proteins","prompt":"What is an integral membrane protein?","choices":["A protein embedded in the membrane structure","A protein that only rests on a surface and never enters the bilayer","A carbohydrate in the glycocalyx","Another name for cholesterol"],"answer":0,"why":"Integral proteins integrate completely into the membrane. Peripheral proteins stay on the inner or outer surface and attach to integral proteins or to phospholipids. Either kind can be an enzyme, a cytoskeleton anchor, or part of a recognition site."},{"id":"l7-006","lecture":7,"topic":"Glycocalyx","prompt":"What is the glycocalyx?","choices":["The hydrophobic core of the bilayer","The sugar coating of glycoproteins and glycolipids on the cell exterior","A stack of thylakoids","The enzyme that hydrolyzes ATP"],"answer":1,"why":"Carbohydrates sit on the outside. Bound to protein they are glycoproteins; bound to lipid they are glycolipids. Together they are the glycocalyx, a hydrophilic “sugar coating” that helps the cell gather dissolved nutrients and recognize other cells."},{"id":"l7-007","lecture":7,"topic":"Recognition","prompt":"Why do membrane recognition markers matter?","choices":["They are the final electron acceptor of respiration","They open and close stomata","They help build tissues and let the immune system tell self from non-self","They replace the sodium-potassium pump"],"answer":2,"why":"Cells carry markers so they can recognize one another. That is part of forming tissues and of immune responses. HIV can hijack receptor proteins to get into a cell and throw off signaling."},{"id":"l7-008","lecture":7,"topic":"Fluidity","prompt":"What happens if a very fine needle is pushed through the membrane and pulled out?","choices":["Any puncture makes the cell explode immediately","The membrane snaps like a rubber balloon and cannot reseal","Cholesterol crystals permanently plug the hole","The lipids flow back and seal the hole"],"answer":3,"why":"The membrane is fluid, but it is not a balloon. It is fairly rigid and can burst if it fills with too much water. A fine puncture, though, flows shut once the needle is gone."},{"id":"l7-009","lecture":7,"topic":"Fluidity","prompt":"Why do unsaturated fatty-acid tails help in the cold?","choices":["Their bends keep space between phospholipids, so the membrane stays fluid","They pack tighter than saturated tails and freeze the membrane solid","They remove cholesterol from animal cells","They stop diffusion completely"],"answer":0,"why":"Saturated tails are straight and compress into a rigid sheet when cold. A double bond bends an unsaturated tail and holds space open. Fish that face changing temperatures shift the mix of saturated and unsaturated fats. Cholesterol in animal cells buffers the same problem: less rigid in the cold, less fluid when warm."},{"id":"l7-010","lecture":7,"topic":"Passive transport","prompt":"Which statement is passive transport?","choices":["A pump burns ATP to move a substance uphill","A substance moves from high concentration to low concentration and the cell spends no energy","A vesicle swallows a whole bacterium","Water is forced out by a contractile vacuole using ATP"],"answer":1,"why":"Passive transport is the natural downhill movement. A concentration gradient is stored energy, and that energy dissipates as the gradient evens out. Each substance diffuses at its own rate."},{"id":"l7-011","lecture":7,"topic":"Diffusion","prompt":"Which materials cross the bilayer by simple diffusion?","choices":["Sodium, potassium, and calcium ions","Glucose and amino acids, with no protein help","Oxygen, carbon dioxide, and fat-soluble vitamins A, D, E, and K","Whole proteins and starch granules"],"answer":2,"why":"Small nonpolar and lipid-soluble materials slip through, including some fat-soluble drugs and hormones. Ions and polar molecules such as simple sugars and amino acids can stick to the outside but need help to cross."},{"id":"l7-012","lecture":7,"topic":"Diffusion","prompt":"Which change slows diffusion?","choices":["A steeper concentration gradient","More membrane surface area","A shorter distance to travel","A heavier molecule, a colder temperature, or a thicker membrane"],"answer":3,"why":"Diffusion speeds up with a steeper gradient, higher temperature, lighter molecules, more surface area, a thinner membrane, a shorter distance, and a less dense solvent. Distance is one reason cells stay small or flattened."},{"id":"l7-013","lecture":7,"topic":"Diffusion","prompt":"Why can severe dehydration impair brain function?","choices":["Cytoplasm loses water, the solvent gets denser, and diffusion slows","Cells speed up every reaction because solutes are closer together","Only osmosis stops; oxygen diffusion is unchanged","The membrane becomes freely permeable to protein"],"answer":0,"why":"As solvent density rises, molecules have a harder time moving. The lecture ties that slowdown to failing cell function, unconsciousness, and possibly coma."},{"id":"l7-014","lecture":7,"topic":"Filtration","prompt":"What is filtration, as the kidney example uses it?","choices":["ATP pumps protein into the urine on purpose","Pressure speeds diffusion, pushing water and solutes out of blood into kidney tubules","Osmosis with no pressure involved","Movement against a concentration gradient"],"answer":1,"why":"Each substance still follows its gradient, but pressure can hurry it. High blood pressure can force proteins into the urine, which is why protein in the urine is a symptom of that pressure."},{"id":"l7-015","lecture":7,"topic":"Facilitated transport","prompt":"How do channels and carriers compare?","choices":["Carriers are faster because they stay open like a pore","Channels always spend ATP","Both move polar materials downhill without ATP; channels are faster","One carrier usually transports many unrelated substances at once"],"answer":2,"why":"The gradient would allow diffusion, but the molecules are polar, so proteins shield them from the hydrophobic interior. Channels may be open or gated. Carriers bind the substance and change shape, and they are usually specific for one substance."},{"id":"l7-016","lecture":7,"topic":"Osmosis","prompt":"Which way does water move during osmosis?","choices":["Toward the side with less solute","The solute crosses until both sides match, and water stays put","Only if the cell spends ATP","Through a membrane toward the side with more solute"],"answer":3,"why":"Osmosis is diffusion of water. Solute that cannot cross takes up space, so the side with more solute has less water. Water diffuses toward that side. A glass with a teaspoon of sugar holds more water than the same volume with a quarter-cup of sugar."},{"id":"l7-017","lecture":7,"topic":"Tonicity","prompt":"A cell is dropped into a hypotonic solution. What happens?","choices":["Water enters, and an animal cell may swell and burst","Water leaves and the cell shrivels","There is no net movement of water","Solute is pumped in until the cell shrinks"],"answer":0,"why":"Hypotonic: the outside has lower osmolarity than the cytoplasm, so water enters. Hypertonic: water leaves. Isotonic: no net movement, though water still crosses both ways. Osmolarity is the solution’s total solute concentration."},{"id":"l7-018","lecture":7,"topic":"Tonicity","prompt":"What is plasmolysis?","choices":["An animal cell builds turgor pressure against a wall it does not have","In a hypertonic solution the plant membrane pulls off the wall and the plant wilts","A plant cell bursts because it has no wall","A contractile vacuole fills the chloroplast"],"answer":1,"why":"Walls stop plant, fungal, bacterial, and some protist cells from lysing when water enters. Incoming water makes turgor that stiffens a nonwoody plant. If the outside is hypertonic, water leaves, the membrane peels off the wall, turgor is lost, and the plant wilts. The wall itself does not collapse."},{"id":"l7-019","lecture":7,"topic":"Osmoregulation","prompt":"How do freshwater fish handle osmosis?","choices":["The water is hypertonic; they secrete salt at the gills and make concentrated urine","They are isotonic with the lake and spend no energy on salt","The water is hypotonic to them; they take up salt at the gills and make dilute urine","A cell wall stops water from entering"],"answer":2,"why":"Saltwater fish do the reverse: secrete salt at the gills and excrete concentrated urine. Many marine invertebrates are isotonic with seawater. The lecture notes fish may spend about five percent of their energy on osmotic balance. Wall-less protists such as paramecia use contractile vacuoles to bail out water."},{"id":"l7-020","lecture":7,"topic":"Electrochemical gradient","prompt":"How does a typical animal cell compare with the fluid outside?","choices":["The inside is positive, with more Na+ than the outside","Na+ and K+ are equal on both sides","Only uncharged molecules differ across the membrane","The inside is negative, with more K+ and less Na+"],"answer":3,"why":"An electrochemical gradient is both concentration and charge. Interior proteins are mostly negative and do not cross, so the cell is electronegative. Na+ is driven in by both its gradient and the charge. K+ is pulled in by the charge but pushed out by its own concentration gradient."},{"id":"l7-021","lecture":7,"topic":"Sodium-potassium pump","prompt":"What does the sodium-potassium pump move?","choices":["3 Na+ out and 2 K+ in, using ATP","3 K+ out and 2 Na+ in","3 Na+ in and 2 K+ out","Equal Na+ and K+, and no ATP"],"answer":0,"why":"The pump is primary active transport and electrogenic: the unequal exchange leaves the inside slightly negative and creates the membrane potential that secondary transport depends on. A red blood cell spends most of its energy holding this imbalance."},{"id":"l7-022","lecture":7,"topic":"Active transport","prompt":"How does secondary active transport differ from primary?","choices":["It uses more ATP per ion than primary transport","It does not use ATP itself; it rides the gradient that primary transport built","It can only move water","It flattens the charge difference instead of using it"],"answer":1,"why":"Primary active transport spends ATP to push ions against an electrical and/or concentration gradient. Secondary transport is still active because it depends on that stored energy. Poisons or a metabolic slump can stall the pumps that keep the gradients."},{"id":"l7-023","lecture":7,"topic":"Transporters","prompt":"Which pairing is right?","choices":["Uniporter: two substances, opposite directions.","Symporter: two substances, opposite directions.","Symporter: two substances, same direction. Antiporter: two substances, opposite directions.","Antiporter: one substance only."],"answer":2,"why":"A uniporter carries one ion or molecule. The same three carrier types show up in facilitated diffusion, where they do not spend ATP. They can also carry small uncharged organics such as glucose."},{"id":"l7-024","lecture":7,"topic":"Endocytosis","prompt":"Which endocytosis description is right?","choices":["All three export waste by fusing with the plasma membrane","Pinocytosis must merge with a lysosome; phagocytosis never does","Receptor-mediated endocytosis is passive and spends no energy","Phagocytosis engulfs particles; pinocytosis takes in fluid; receptor-mediated uptake is specific"],"answer":3,"why":"Endocytosis is active. The membrane pockets around the target and pinches off a vesicle. A neutrophil’s phagocytic vesicle merges with a lysosome to destroy what it ate. Pinocytosis makes small fluid vesicles and does not need a lysosome."},{"id":"l7-025","lecture":7,"topic":"Endocytosis","prompt":"What fails in familial hypercholesterolemia?","choices":["LDL receptors are missing or defective, so “bad” cholesterol stays in the blood","The sodium-potassium pump runs backward","Cells exocytose too much LDL on purpose","Glycolysis stops in every red blood cell"],"answer":0,"why":"Receptor-mediated endocytosis normally clears LDL from the blood. When the receptors fail, cholesterol climbs to life-threatening levels. Flu virus, diphtheria toxin, and cholera toxin can slip in through normal receptor sites. HIV uses receptors the same general way."},{"id":"l7-026","lecture":7,"topic":"Exocytosis","prompt":"What is exocytosis?","choices":["The cell drinks a droplet of extracellular fluid","A vesicle fuses with the plasma membrane and releases its contents outside","A pump swaps one ion in for one ion out","Water leaves only through a protein channel"],"answer":1,"why":"Bulk transport moves large material that cannot cross the bilayer even with energy. Exocytosis wraps it in membrane, fuses that membrane with the cell surface, and dumps the contents outside."},{"id":"l7-027","lecture":7,"topic":"Clinical","prompt":"A doctor injects “isotonic” saline and red blood cells burst. What was the solution?","choices":["Truly isotonic — lysis is normal in isotonic saline","Hypertonic — shrinking is what bursts a red cell","Hypotonic — water entered the cells and they lysed","Pure potassium, which only affects the heart"],"answer":2,"why":"Isotonic fluid should not change cell volume. Burst cells mean water rushed in, so the outside was hypotonic (lower osmolarity than the cytoplasm). A hypertonic solution would pull water out instead."},{"id":"l7-028","lecture":7,"topic":"Clinical","prompt":"Why can an injected potassium solution stop the heart?","choices":["It makes the blood so hypotonic that the heart swells and bursts","It blocks hemoglobin from binding oxygen and nothing else","It freezes the plasma membrane","It wrecks the Na+/K+ balance that keeps the heartbeat regular"],"answer":3,"why":"When the potassium reaches the heart it disturbs the sodium and potassium balance. The beat becomes irregular and then stops. That is why some lethal-injection and euthanasia protocols use a potassium solution."},{"id":"l8-029","lecture":8,"topic":"Bioenergetics","prompt":"What is bioenergetics?","choices":["Energy flow through living things, including building and breaking molecules","Only the study of heat loss in machines","Another name for osmosis","Copying of mitochondrial DNA"],"answer":0,"why":"Cells constantly spend energy to import nutrients, build and break molecules, move material, export waste, and drive flagella or cilia. Those changes happen as stepwise chemical reactions."},{"id":"l8-030","lecture":8,"topic":"Metabolism","prompt":"Which pairing is right?","choices":["Endergonic reactions release energy; exergonic reactions require it","Exergonic reactions release energy; endergonic reactions require it","Both always have a negative change in free energy","Exergonic reactions never need activation energy"],"answer":1,"why":"Metabolism is every chemical reaction in the cell that uses or releases energy. Cells have to keep taking energy in, because those reactions never stop."},{"id":"l8-031","lecture":8,"topic":"Carbohydrates","prompt":"Where does the energy in the sugar you eat originally come from?","choices":["The sodium-potassium pump","Heat released once a cell reaches equilibrium","Sunlight captured when photosynthesis built the sugar","Nitrogen passing through a food web"],"answer":2,"why":"Plants use sunlight to turn CO2 into sugar. That takes energy in order to store energy. Glucose is then used to make ATP. Plants store glucose as starch; animals store it as glycogen. Photosynthesis and cellular respiration are reverse formulas of each other."},{"id":"l8-032","lecture":8,"topic":"ATP","prompt":"What is ATP?","choices":["The storage polysaccharide in animals","An enzyme that lowers activation energy","A B-vitamin electron carrier","Adenosine triphosphate, the main energy currency of the cell"],"answer":3,"why":"ATP is small, but some of its bonds hold a lot of usable energy. It powers most energy-requiring reactions in the cell, the way money is exchanged for work."},{"id":"l8-033","lecture":8,"topic":"Pathways","prompt":"What is a metabolic pathway?","choices":["A step-by-step series of reactions that turns a substrate into a product through intermediates","One collision that finishes an entire route at once","Only the reactions that happen outside cells","The movement of water across a membrane"],"answer":0,"why":"Anabolic pathways build complex molecules and cost energy: sugar from CO2, protein from amino acids, DNA from nucleotides. Catabolic pathways break complex molecules down and release energy. Together they are metabolism. This lecture’s accounting says one glucose can make about 36–38 ATP."},{"id":"l8-034","lecture":8,"topic":"Enzymes","prompt":"Do pathway reactions just happen?","choices":["Yes, if the step is exergonic","No. An enzyme catalyzes each step, whether that step releases or requires energy","Enzymes are needed only for endergonic steps","Each enzyme is used up by the step it catalyzes"],"answer":1,"why":"Breaking down and building up both need catalysts. The enzyme is not consumed. All branches of life share some pathways, a sign of a common ancestor; later, extra enzymes let lineages fit their environments."},{"id":"l8-035","lecture":8,"topic":"Energy types","prompt":"What is chemical energy?","choices":["The kinetic energy of a moving wrecking ball","Energy that exists only as light","Potential energy stored in bonds","Heat that has already been lost and cannot do work"],"answer":2,"why":"Kinetic energy is motion: a bullet, a molecule in air, light. Potential energy is the capacity to do work, like a hanging wrecking ball. Mid-fall the ball is about half and half. Just before impact it is nearly all kinetic. Bonds in food hold chemical energy that is released when they are broken. Gasoline’s chemical energy becomes the kinetic energy of a car."},{"id":"l8-036","lecture":8,"topic":"Free energy","prompt":"What is free energy (G)?","choices":["The total heat in the universe","Another name for activation energy","Energy stored only as a membrane potential","Usable energy left after entropy is accounted for"],"answer":3,"why":"Entropy measures randomness or disorder. Heat counts as entropy. Every reaction loses some energy as heat, so free energy is what remains to do work. Reactions are compared by the change, ∆G."},{"id":"l8-037","lecture":8,"topic":"Free energy","prompt":"What does the sign of ∆G tell you?","choices":["∆G < 0 is exergonic; ∆G > 0 is endergonic","∆G > 0 is exergonic and releases free energy","Both must be zero or the reaction cannot occur","∆G is negative only when an enzyme is present"],"answer":0,"why":"Exergonic products have less free energy than the reactants; some was lost as heat. These are sometimes called spontaneous, which does not mean fast — rusting iron is spontaneous and slow. Endergonic products have more free energy and will not proceed without an energy input. Enzymes do not flip the sign of ∆G."},{"id":"l8-038","lecture":8,"topic":"Equilibrium","prompt":"Why must a living cell avoid chemical equilibrium?","choices":["Equilibrium is the point of maximum usable energy","At equilibrium there is no free energy left to do the work of staying alive","Cells reach equilibrium every few seconds and then restart with no input","Equilibrium only happens in reactions that have no enzymes"],"answer":1,"why":"Most reactions are reversible and drift toward the lowest free energy and the highest entropy. Pushing away from equilibrium means adding, removing, or changing reactants or products. Materials keep crossing the membrane — the sodium-potassium pump is the lecture’s picture — so the cell approaches equilibrium and never arrives. If it did, it would die."},{"id":"l8-039","lecture":8,"topic":"Activation energy","prompt":"What is activation energy?","choices":["The ∆G of an exergonic reaction","Energy released by ATP hydrolysis only","The input needed to reach the strained transition state where bonds can break","A measure of entropy at equilibrium"],"answer":2,"why":"Both exergonic and endergonic reactions need at least a little activation energy before any energy-releasing phase. The transition state is high-energy and unstable. A higher barrier means a slower reaction. A spark can start a fuel that is strongly exergonic but otherwise barely reacts, and the reaction then supplies its own continuation."},{"id":"l8-040","lecture":8,"topic":"Catalysis","prompt":"What do heat, pressure, and a catalyst each do?","choices":["A catalyst raises activation energy and changes ∆G","Heat lowers activation energy to zero for most cellular reactions","Pressurizing a system stops reactions","Heat and pressure make collisions more frequent; a catalyst lowers activation energy"],"answer":3,"why":"Heat speeds molecules so they collide harder and more often and reach the transition state. For most cell chemistry the barrier is still too high for heat alone at a useful rate. Catalysis lowers activation energy. It does not change ∆G, so it does not decide whether the reaction is endergonic or exergonic."},{"id":"l8-041","lecture":8,"topic":"Thermodynamics","prompt":"Which statement matches an organism and the first law?","choices":["Organisms are open systems, and energy is neither created nor destroyed","Organisms are closed systems that manufacture new energy","The first law says every transfer destroys some energy","A closed system exchanges energy freely with its surroundings"],"answer":0,"why":"An open system can exchange energy with the surroundings; a living thing is open. A closed system cannot. The first law: the energy of the universe is constant. It only changes form — a bulb turns electricity into light, a plant turns sunlight into chemical energy."},{"id":"l8-042","lecture":8,"topic":"Thermodynamics","prompt":"What does the second law say about energy transfers?","choices":["Every transfer keeps all of the energy in a useful form","None is 100% efficient; some energy becomes unusable, usually heat, and the universe’s entropy rises","Living things decrease the entropy of the universe","Entropy falls as a reaction approaches equilibrium"],"answer":1,"why":"Heat lost to friction or to metabolism is still energy, just not useful work. More energy dumped to the surroundings means more entropy. High entropy means high disorder and low usable energy. A bedroom stays tidy only if someone spends energy on it. Living things stay organized the same way, and the universe’s entropy still increases. The heat is also why warm-blooded animals hold their temperature."},{"id":"l8-043","lecture":8,"topic":"Ecology","prompt":"What did Elton’s Arctic food web show about energy?","choices":["About 90% of sunlight becomes herbivore biomass","Transfer is nearly 100% efficient, so top predators are the most numerous","About 1% of sunlight becomes plant biomass, and about 10% of the energy moves to the next consumer level","Larger animals must outnumber the smaller ones they eat"],"answer":2,"why":"Charles Elton tracked who ate whom and treated nitrogen flow as a stand-in for energy flow. Because each handoff is inefficient, animals higher in the chain, or simply larger, are fewer than those below them. Polar bears are fewer than lemmings. His pyramids of energy, numbers, and biomass are still in ecology texts."},{"id":"l8-044","lecture":8,"topic":"ATP","prompt":"How does a cell actually spend ATP?","choices":["ATP is burned like wood and the flame does the work","ATP is so stable that cells store it for weeks","Breaking a phosphate bond absorbs energy instead of releasing it","Hydrolysis releases a phosphate, and energy coupling uses that to drive work such as the sodium-potassium pump"],"answer":3,"why":"Hydrolysis splits a molecule by adding water. ATP hydrolysis yields ADP and inorganic phosphate plus free energy. ATP is unstable and must be used quickly or the energy leaves as heat. In coupling, the phosphate is attached to another molecule — phosphorylation — which is how the pump is powered."},{"id":"l8-045","lecture":8,"topic":"Enzymes","prompt":"Which statement about enzymes is true?","choices":["They lower activation energy, do not change ∆G, and come out of the reaction unchanged","They are consumed like a reactant","They turn an endergonic reaction exergonic by changing ∆G","They raise activation energy so the reaction stays controlled"],"answer":0,"why":"Almost all enzymes are proteins. The active site holds the substrate so bonds can break or form. When the reaction is over the products leave and the protein is back where it started. That unchanged exit is the hallmark of an enzyme."},{"id":"l8-046","lecture":8,"topic":"Enzymes","prompt":"What is induced fit?","choices":["The substrate permanently denatures the enzyme","Binding causes a small shift in the enzyme so the substrate sits better than in a rigid lock and key","Any substrate fits any active site","The enzyme changes the substrate before the two ever touch"],"answer":1,"why":"The active site is a specific chemical neighborhood of amino-acid side chains: large or small, acidic or basic, polar or nonpolar, charged or neutral. Induced fit is a mild shape change that improves catalysis. There is a matched enzyme for each substrate, with some flexibility."},{"id":"l8-047","lecture":8,"topic":"Enzymes","prompt":"What can denature an enzyme?","choices":["Heat always speeds enzymes and never harms them","Only cold unfolds proteins; acid does not","Too much heat, or a pH that is too acidic or too basic","Binding a coenzyme, which is what denaturation means"],"answer":2,"why":"A little warming speeds collisions. Too much heat unfolds the protein. The wrong pH does too. Enzyme amounts also follow demand: a digestive cell needs more right after a meal than a blood cell does, and stomach cells are not running the blood-cell set."},{"id":"l8-048","lecture":8,"topic":"Regulation","prompt":"Which description of enzyme control is right?","choices":["A competitive inhibitor binds only an allosteric site","An allosteric activator lowers affinity for the substrate","Feedback inhibition speeds the pathway when product piles up","A competitive inhibitor blocks the active site; a noncompetitive inhibitor binds elsewhere and blocks the substrate"],"answer":3,"why":"Allosteric inhibition changes the shape and lowers affinity; an allosteric activator does the opposite. Feedback inhibition lets the product slow its own production. ATP synthesis slows when ATP is already abundant, which matters because spare ATP just falls apart into ADP and wastes the energy."},{"id":"l8-049","lecture":8,"topic":"Cofactors","prompt":"Which helpers does this lecture name?","choices":["Zinc for DNA polymerase, and vitamin C for pyruvate dehydrogenase","Starch for every lysosomal enzyme, and chlorophyll for hexokinase","Only ATP — enzymes never need a vitamin or a metal","Sodium for DNA polymerase, and cholesterol for pyruvate dehydrogenase"],"answer":0,"why":"Many enzymes work poorly until a cofactor or coenzyme holds the right shape. The bond can be temporary or permanent. Dietary vitamins are the main source of coenzymes. Eukaryotes also compartmentalize enzymes: debris digestion in the lysosome, late-stage respiration in the mitochondria."},{"id":"l9-050","lecture":9,"topic":"Overview","prompt":"What does cellular respiration do?","choices":["It builds glucose from carbon dioxide and light","It harvests chemical energy stored in glucose and converts it to ATP","It moves water into a hypotonic cell","It copies chlorophyll"],"answer":1,"why":"Respiration is a series of pathways that turn the chemical energy of glucose into a form the cell can spend. Plants first store sunlight in glucose; respiration is how that store is withdrawn."},{"id":"l9-051","lecture":9,"topic":"Redox","prompt":"What does “LEO the lion says GER” mean?","choices":["Lose electrons = reduction; gain electrons = oxidation","Both names mean the electron count stayed the same","Lose electrons = oxidation; gain electrons = reduction","Oxidation means adding oxygen only, and electrons are not involved"],"answer":2,"why":"Oxidation and reduction run together, so the pair is called a redox reaction. The oxidized compound loses potential energy; the reduced compound gains it. Cells withdraw energy from food in small packages by following the electrons. One burst would be destructive."},{"id":"l9-052","lecture":9,"topic":"Electron carriers","prompt":"Which form of NAD is carrying high-energy electrons?","choices":["NAD+ is reduced and NADH is oxidized","Both are proteins of the sodium-potassium pump","NAD+ is made from vitamin B2, riboflavin","NADH, the reduced form; NAD+ is oxidized"],"answer":3,"why":"NAD (nicotinamide adenine dinucleotide) comes from niacin, vitamin B3. It shuttles electrons between compounds. The compound that reduces NAD+ (RH in the lecture’s equation) is the reducing agent. NAD+, which oxidizes that compound, is the oxidizing agent."},{"id":"l9-053","lecture":9,"topic":"Electron carriers","prompt":"How do FAD and NADP differ from NAD in this lecture?","choices":["FADH2 is reduced flavin from vitamin B2; NADP has an extra phosphate and is used in biosynthesis and photosynthesis","FAD is the carrier with the extra phosphate, used in the Calvin cycle","NADP and NAD+ are the same molecule","FAD comes from vitamin B3 and NAD comes from vitamin B2"],"answer":0,"why":"NAD and FAD are used heavily while extracting energy from sugars. NADP matters in anabolic reactions, including photosynthesis."},{"id":"l9-054","lecture":9,"topic":"ATP","prompt":"Why store energy in ATP instead of as free energy in the cell?","choices":["ATP is stable for months, so the cell fills a vacuole with it","Loose energy becomes damaging heat; ATP holds it until a job needs it","Cells prefer to keep energy as free protons in the cytosol","ATP has no charge repulsion, so it is inert"],"answer":1,"why":"The phosphates repel one another, so ATP and ADP are unstable — a rechargeable battery, not a storage tank. Making ATP stores energy; dephosphorylation releases it, usually by passing a phosphate to another molecule. Hydrolysis yields ADP, inorganic phosphate, and free energy. Putting the phosphate back on ADP regenerates the water that hydrolysis had split."},{"id":"l9-055","lecture":9,"topic":"Making ATP","prompt":"During glucose breakdown, where does most of the ATP come from?","choices":["Substrate-level phosphorylation makes about 90%","Chemiosmosis in the nucleus","Chemiosmosis, about 90%; substrate-level phosphorylation makes only a few ATP","Both routes require light"],"answer":2,"why":"Phosphorylation means adding a phosphate. Substrate-level phosphorylation takes a phosphate off an intermediate and puts it on ADP, about 10% of the ATP. Chemiosmosis runs in eukaryotic mitochondria or in the prokaryotic plasma membrane. Oxidative phosphorylation is the name for ATP made in the presence of oxygen. The sugars that feed this are glucose, fructose, and galactose — same formula C6H12O6, different arrangements."},{"id":"l9-056","lecture":9,"topic":"Order","prompt":"What is the order of aerobic respiration in this lecture?","choices":["Citric acid cycle, glycolysis, then the Calvin cycle","Oxidative phosphorylation first, and pyruvate is never oxidized","Fermentation, then the light-dependent reactions","Glycolysis, pyruvate oxidation, citric acid cycle, oxidative phosphorylation"],"answer":3,"why":"Pyruvate has to be oxidized before it can enter the citric acid cycle. Oxidative phosphorylation — electron transport plus chemiosmosis — makes most of the ATP."},{"id":"l9-057","lecture":9,"topic":"Glycolysis","prompt":"Where does glycolysis run, and does it use oxygen?","choices":["In the cytoplasm, and it does not use oxygen directly","In the mitochondrial matrix, and it requires oxygen","Inside the thylakoid lumen","Only in prokaryotes"],"answer":0,"why":"Nearly all organisms run glycolysis. Glucose enters by secondary active transport against its gradient, or through GLUT proteins by facilitated diffusion. Mature mammalian red blood cells have no mitochondria, so glycolysis is their only ATP source. If it stops, their sodium-potassium pumps fail and the cells die."},{"id":"l9-058","lecture":9,"topic":"Glycolysis","prompt":"What is the net yield of glycolysis per glucose?","choices":["36 ATP and no NADH","2 pyruvate, 2 ATP, and 2 NADH","1 pyruvate, 2 FADH2, and 28 ATP","2 pyruvate and 4 ATP net, with no NADH"],"answer":1,"why":"The energy-requiring half traps glucose, rearranges the 6-carbon sugar, and splits it into two pyruvates, at a cost of 2 ATP. The energy-releasing half pays those back and yields 2 more ATP plus 2 NADH. Four ATP are made in that second half; two replace the investment."},{"id":"l9-059","lecture":9,"topic":"Yield","prompt":"Which yield matches this lecture’s comparison?","choices":["Fermentation about 32–36 ATP; aerobic respiration 2 ATP","Both yield exactly 2 ATP","Aerobic respiration about 32–36 ATP per glucose; fermentation 2 ATP","Fermentation yields oxygen instead of ATP"],"answer":2,"why":"Aerobic: glucose + oxygen → carbon dioxide + water + ATP. Fermentation: glucose → ethanol + carbon dioxide + 2 ATP. Later slides also say humans make about 34 ATP per glucose, and that the count varies. Know both the range and the human figure."},{"id":"l9-060","lecture":9,"topic":"Pyruvate oxidation","prompt":"What happens to pyruvate if oxygen is present?","choices":["It is stored as glycogen in the nucleus","It is split into glucose and oxygen","It feeds Complex IV directly and makes 28 ATP on the spot","It enters the mitochondrion and becomes acetyl CoA; NAD+ is reduced, and a carbon leaves as CO2"],"answer":3,"why":"The conversion is a three-step process and runs twice, once for each pyruvate. Electrons caught by NADH are used later to make ATP. Whenever a carbon is removed, it leaves as CO2."},{"id":"l9-061","lecture":9,"topic":"Citric acid cycle","prompt":"Which description of the citric acid cycle is right?","choices":["A closed loop in the mitochondria, also called the Krebs or TCA cycle","A linear pathway in the cytoplasm that ends as ethanol","Another name for glycolysis","A cycle that runs in the chloroplast stroma"],"answer":0,"why":"Hans Krebs worked the pathway out in 1930. Unlike glycolysis, the end of the cycle regenerates a compound the first step needs. It is eight steps of redox, dehydration, and decarboxylation."},{"id":"l9-062","lecture":9,"topic":"Citric acid cycle","prompt":"What does one turn of the citric acid cycle release?","choices":["2 ATP, 2 NADH, and no CO2","2 CO2, 1 ATP (or GTP), 3 NADH, and 1 FADH2","1 glucose and 6 O2","Only NADPH"],"answer":1,"why":"The cycle turns twice per glucose. Two carbons enter from each acetyl group. Per glucose the cycle’s books are 6 NADH, 2 FADH2, and 2 ATP, and the six carbons of glucose leave as CO2 once pyruvate oxidation’s two CO2 are included. GTP is an ATP equivalent with a more limited use. The cycle is amphibolic: it breaks acetyl groups down and also supplies pieces for many nonessential amino acids."},{"id":"l9-063","lecture":9,"topic":"Citric acid cycle","prompt":"Why is the citric acid cycle called aerobic if it does not consume oxygen?","choices":["Oxygen is a substrate in every step of the cycle","The cycle stops whenever NAD+ is available","Its NADH and FADH2 pass electrons to a later pathway that does use oxygen","It occurs in the lungs"],"answer":2,"why":"The cycle itself does not take up O2, and it makes very little ATP directly. The first step is under negative feedback from ATP: high ATP slows it, and a need for ATP speeds it. The third step is inhibited by ATP and NADH and stimulated by ADP."},{"id":"l9-064","lecture":9,"topic":"Feedback","prompt":"Which example is positive feedback?","choices":["A toilet float shuts the valve as the tank fills","Prairie grasses slow their own growth once they are dense","ATP binding slows an early enzyme in respiration","Oxytocin causes contractions that cause more oxytocin until the baby is born"],"answer":3,"why":"Positive feedback amplifies the original change. Platelet clotting is the other lecture example: activated platelets activate more platelets. Negative feedback dampens the change. The toilet valve and prairie-grass crowding are the negative examples. Hemophilia is a failure of clotting proteins, so the positive loop cannot finish the clot."},{"id":"l9-065","lecture":9,"topic":"Oxidative phosphorylation","prompt":"Oxidative phosphorylation is which two processes?","choices":["The electron transport chain and chemiosmosis","Glycolysis and fermentation","The Calvin cycle and stomatal opening","Substrate-level phosphorylation only, in the cytoplasm"],"answer":0,"why":"Both occur in mitochondria and together make most of the ATP. Redox reactions pile H+ in the intermembrane space. H+ flows back into the matrix through ATP synthase, and that flow powers the addition of phosphate to ADP."},{"id":"l9-066","lecture":9,"topic":"Electron transport","prompt":"What is unique about oxygen in glucose metabolism?","choices":["Glycolysis consumes the oxygen","The electron transport chain is the only part that uses O2, and O2 is the final electron acceptor","The citric acid cycle is the only step that uses O2","CO2 is the final electron acceptor in humans"],"answer":1,"why":"Animals get that oxygen through a respiratory system. Plants, fungi, and bacteria rely more on diffusion; plants use stomata. The chain is a series of redox steps, like a bucket brigade, ending when electrons reduce oxygen. With protons, that makes water."},{"id":"l9-067","lecture":9,"topic":"Electron transport","prompt":"Where is the electron transport chain?","choices":["Outer mitochondrial membrane in both","The stroma of the chloroplast","Inner mitochondrial membrane in eukaryotes; plasma membrane in prokaryotes","Free in the cytosol, with no membrane"],"answer":2,"why":"Prokaryotes have no mitochondria, so the chain sits in the plasma membrane. The chain is four protein complexes plus mobile electron carriers, with multiple copies in the membrane."},{"id":"l9-068","lecture":9,"topic":"Complexes","prompt":"Why does FADH2 usually yield less ATP than NADH?","choices":["Complex II pumps more protons than Complex I","FADH2 electrons enter at Complex IV and skip every pump","NADH does not donate electrons to the chain at all","Complex II takes FADH2 and skips Complex I, so fewer protons are pumped"],"answer":3,"why":"Complex I takes two electrons from NADH and pumps four H+ from the matrix into the intermembrane space. ATP yield tracks how many protons are moved. The lecture also notes NAD-linked shuttles in liver and FAD-linked shuttles in brain as one reason the ATP count per glucose differs by tissue."},{"id":"l9-069","lecture":9,"topic":"Complexes","prompt":"What does Complex IV do?","choices":["It reduces oxygen, which picks up protons to form water","It splits water the way Photosystem II does","It releases oxygen gas as its main product","It builds glucose from CO2"],"answer":0,"why":"Complex III pumps protons and passes electrons to Complex IV. Using protons to make water also supports the gradient for chemiosmosis. At the end of the pathway the electrons that started in glucose have reduced oxygen, and the extra charge attracts protons to finish the water."},{"id":"l9-070","lecture":9,"topic":"Chemiosmosis","prompt":"How does ATP synthase make ATP?","choices":["It spends ATP to pump water out of the matrix","H+ flowing down the electrochemical gradient turns it, and it adds phosphate to ADP","It works only after the proton gradient has already collapsed to zero","It is a peripheral protein with no path through the membrane"],"answer":1,"why":"The chain’s free energy pumps H+ out of the matrix, building both a concentration gradient and an electrical gradient. H+ cannot cross the nonpolar bilayer on its own, so it returns through this integral protein, which acts like a small generator. Chemiosmosis makes about 90% of the ATP from aerobic breakdown of glucose."},{"id":"l9-071","lecture":9,"topic":"Yield","prompt":"Which bookkeeping figures does this lecture give?","choices":["Humans about 2 ATP per glucose, with 90% of the energy captured","Every species makes exactly 38 ATP, with no heat loss","Humans about 34 ATP per glucose; about 34% of the energy captured, the rest lost as heat","FADH2 always yields more ATP than NADH"],"answer":2,"why":"The count varies by species, by how many H+ the chain can pump, by the shuttle, and by intermediates pulled off for other jobs. Electron transport’s reusable products are NAD+ and FAD, plus water and the protons used in chemiosmosis. One slide assigns about 28–32 ATP to chemiosmosis itself."},{"id":"l9-072","lecture":9,"topic":"No oxygen","prompt":"In this lecture, how do fermentation and anaerobic respiration differ?","choices":["They are the same pathway, and both require oxygen","Fermentation uses oxygen but skips glycolysis","Anaerobic respiration is the Calvin cycle","Fermentation uses only glycolysis and an organic acceptor; anaerobic respiration still uses the cycle and a chain with an acceptor other than O2"],"answer":3,"why":"Without O2, NADH has to be oxidized back to NAD+ or glycolysis stops. The lecture’s anaerobic respiration still lists glycolysis, the citric acid cycle, and oxidative phosphorylation, but the acceptor can be sulfur, nitrate, carbon dioxide, or iron, and the stated yield is 2 ATP per glucose. Fermentation does not run those later pathways."},{"id":"l9-073","lecture":9,"topic":"Anaerobic respiration","prompt":"What do E. coli and methanogens use instead of oxygen?","choices":["E. coli can hand electrons to nitrate; methanogens can hand them to CO2 and release methane","Both can use only oxygen, and methanogens release oxygen","Both run the Calvin cycle in a chloroplast","Nitrate reductase makes ethanol in muscle"],"answer":0,"why":"E. coli in the gut uses nitrate reductase so NO3− can be the final acceptor, and oxidative phosphorylation still occurs — just less efficiently. Methanogens are archaea in soil and in ruminant guts (cows and sheep). The lecture’s headline yield for this kind of anaerobic respiration is 2 ATP per glucose, against a 34–38 ATP aerobic comparison on that same slide."},{"id":"l9-074","lecture":9,"topic":"Fermentation","prompt":"Why is fermentation less efficient than aerobic respiration?","choices":["It makes 34 ATP but wastes them as heat","Glucose is not fully broken down, and the NADH cannot be used to make more ATP","It skips glycolysis, the only ATP-making step","It oxidizes glucose all the way to CO2 and H2O without capturing anything"],"answer":1,"why":"Fermentation is the breakdown of an organic fuel such as glucose with no net removal of electrons: electrons taken off the fuel are given back to a different organic molecule when lactate or ethanol is made. The yield is 2 ATP per glucose. If NADH piled up instead, it could donate electrons and form free radicals that damage lipids, proteins, and DNA."},{"id":"l9-075","lecture":9,"topic":"Alcohol fermentation","prompt":"What is the order of alcohol fermentation after glycolysis?","choices":["Pyruvate becomes lactic acid, and oxygen is released","Acetaldehyde is oxidized by NAD+ to make more NADH","Pyruvate becomes CO2 and acetaldehyde; NADH reduces acetaldehyde to ethanol and becomes NAD+","The citric acid cycle turns twice and yields about 34 ATP"],"answer":2,"why":"Yeast fermenting sugar under anaerobic conditions keeps a supply of ATP. Returning NADH to NAD+ lets more glucose run through glycolysis and keeps free radicals down. The lecture notes yeast ethanol tolerance from about 5% to 21%, depending on strain and conditions. Bread uses both aerobic and anaerobic metabolism: aerobic rise, anaerobic flavor and texture."},{"id":"l9-076","lecture":9,"topic":"Lactic acid fermentation","prompt":"What happens in hard-working muscle when oxygen cannot keep up?","choices":["Muscle turns pyruvate into ethanol and CO2","The electron transport chain makes lactic acid using oxygen","The liver cannot do anything with lactic acid","NADH reduces pyruvate to lactic acid and is restored to NAD+"],"answer":3,"why":"The cell still gets its 2 ATP. The burn or cramp is tied to lactic acid, which the liver later turns back into pyruvate. Many prokaryotes are facultative anaerobes and switch between aerobic respiration and fermentation depending on oxygen. Gas from fermenting particular sugars is also used to identify bacteria in the lab."},{"id":"l9-077","lecture":9,"topic":"Connections","prompt":"How can a turkey sandwich become ATP?","choices":["Breakdown products of carbs, fats, and proteins feed glycolysis or the citric acid cycle","Only free glucose can enter; fat and protein are excreted unused","Whole proteins enter at Complex IV","Fats are burned in the chloroplast during the Calvin cycle"],"answer":0,"why":"Glycogen is split to glucose. Sucrose and lactose become fructose, glucose, and galactose, which make as much ATP as glucose. Amino acids are usually recycled into protein; in excess or starvation some enter these pathways after the amino group is removed as ammonia. The liver builds urea from two ammonias and one CO2, and urea leaves in urine. Triglycerides are the long-term animal store and can be made or broken along these routes. Cholesterol supports membrane flexibility and is a precursor of steroid hormones."},{"id":"l9-078","lecture":9,"topic":"Regulation","prompt":"How does the cell keep respiration from running flat out?","choices":["One enzyme runs every step both ways until equilibrium","GLUT supply, separate enzymes for the two directions, allosteric effectors, and a few irreversible committed steps","The cell always makes maximum ATP and never diverts intermediates","Feedback is impossible because every step is reversible"],"answer":1,"why":"The cell does not want maximum ATP all the time. Intermediates are also needed for amino acids, proteins, glycogen, lipids, and nucleic acids. Two enzymes, one each way, keep a pathway from sitting at equilibrium. Allosteric effectors reshape the active site. If an irreversible early step fires, the rest of that stretch is committed. Glycolysis is regulated mainly at steps 1, 3, and 10, and the first two of those spend ATP."},{"id":"l9-079","lecture":9,"topic":"Mitochondrial disease","prompt":"What do the lecture’s mitochondrial disorders have in common?","choices":["They block glycolysis only and leave oxidative phosphorylation untouched","They are caused only by bacterial infection, never by DNA","Cells make less ATP than normal; type 2 diabetes is linked to less efficient NADH oxidation","They increase ATP yield above the aerobic maximum"],"answer":2,"why":"The disorders can come from nuclear or mitochondrial DNA. Signs include muscle weakness, poor coordination, stroke-like episodes, and loss of vision or hearing. Many are found in childhood, but not all. In the type 2 diabetes note, the hit is to oxidative phosphorylation, not to the other parts of respiration. The career path named in class is a bachelor’s degree, medical school, then medical genetics."},{"id":"l10-080","lecture":10,"topic":"Overview","prompt":"What is unique about photosynthesis among biological processes?","choices":["It is how animals digest protein","It replaces respiration, so plants never respire","It consumes oxygen in order to make CO2 as its main product","It captures sunlight and stores it in chemical compounds, and it supplies oxygen for many organisms"],"answer":3,"why":"Light energizes electrons, and that energy is stored in sugar bonds. A meal can be spent in hours. Burning fossil fuel releases photosynthetic energy buried roughly 200–350 million years ago. The carbon in living things — including Hyperion, listed at 379.1 feet — came from CO2 in the air."},{"id":"l10-081","lecture":10,"topic":"Feeding modes","prompt":"Which definition is right?","choices":["Photoautotrophs use light; chemoautotrophs tap inorganic chemicals; heterotrophs use sugars made by others","Heterotrophs make their own food from light","Chemoautotrophs include plants and animals","Only fungi are photoautotrophs"],"answer":0,"why":"Photoautotrophs are plants, algae, and cyanobacteria. Chemoautotrophs are a small group of bacteria. Animals, fungi, and most bacteria are heterotrophs. Mixotrophs do both; the lecture’s example is a solar-powered sea slug. A lizard basking on a rock is only warming up — that is not photosynthesis. Photosynthesis stores solar energy in carbohydrate bonds and powers about 99% of Earth’s ecosystems."},{"id":"l10-082","lecture":10,"topic":"Equation","prompt":"Which equation is photosynthesis?","choices":["Glucose + oxygen → carbon dioxide + water","Carbon dioxide + water → glucose + oxygen","Nitrogen + water → protein + oxygen","Oxygen + light → carbon dioxide + ATP"],"answer":1,"why":"The short equation hides many steps. The reactants are particular wavelengths of light, low-energy CO2, and water. The carbohydrate product emphasized in class is G3P, which can become glucose, sucrose, and many other sugars. Those sugars are the backbone of organic molecules."},{"id":"l10-083","lecture":10,"topic":"Leaf structure","prompt":"Where in a leaf does photosynthesis happen, and where is gas exchanged?","choices":["In the root epidermis; stomata sit on the upper surface to catch the wind","In the stomata themselves, which are the fluid around the grana","In the mesophyll; gases move through stomata, usually on the lower surface","In guard cells, which are mitochondria"],"answer":2,"why":"The mesophyll is the middle layer. A stoma is a regulated pore for gas exchange and water balance. The lower surface sees less sun and wind, so less water is lost. Guard cells swell or shrink with osmotic changes and open or close the pore."},{"id":"l10-084","lecture":10,"topic":"Vocabulary","prompt":"What is the difference between stroma and stomata?","choices":["They are two spellings of the same pore","Stroma is a stack of thylakoids; stomata are chlorophyll molecules","Stroma is the intermembrane space of a mitochondrion","Stroma is the fluid around the grana; stomata are pores in the leaf"],"answer":3,"why":"This mix-up is called out in the lecture. The Calvin cycle runs in the stroma. Stomata (singular stoma) are the leaf pores."},{"id":"l10-085","lecture":10,"topic":"Chloroplast","prompt":"Which chloroplast map is right?","choices":["Double membrane; thylakoid discs in grana; chlorophyll in the thylakoid membrane; lumen inside; stroma outside the stacks","A single membrane, with chlorophyll dissolved in the cytoplasm","Thylakoids in the mitochondrial matrix and chlorophyll in the nucleus","Grana are stacks of mitochondria"],"answer":0,"why":"The double membrane fits an origin in free-living cyanobacteria. Chlorophyll is the pigment that first meets the light. The thylakoid membrane also holds the photosynthetic electron-transport proteins. The lumen is the space inside a thylakoid. A granum is a stack. The stroma is the liquid around the grana."},{"id":"l10-086","lecture":10,"topic":"Two stages","prompt":"How do the two stages of photosynthesis divide the work?","choices":["The Calvin cycle captures the photons, and the thylakoid reactions ignore its needs","Light-dependent reactions store light as chemical energy; light-independent reactions use it to build sugar from CO2","Both stages are called the dark cycle because they run only at night","Light-independent reactions split water and release oxygen"],"answer":1,"why":"The light-independent reactions do not use photons directly, but they need ATP and NADPH from the light reactions, and many of their enzymes are switched on by light. Calling them the dark cycle is misleading, and this lecture drops that name. The other names are the Calvin cycle and the Calvin–Benson cycle."},{"id":"l10-087","lecture":10,"topic":"Light","prompt":"How do wavelength and energy relate?","choices":["A longer wavelength always carries more energy","Gamma rays and radio waves are equally useful to a leaf","A shorter wavelength carries more energy than a longer one","Energy depends only on brightness, not on wavelength"],"answer":2,"why":"Wavelength is the distance between crests. Short, tight waves in a heavy rope take more effort than long, lazy ones. The electromagnetic spectrum runs from short gamma rays to long radio waves. The higher-energy waves, including X-rays and UV, can penetrate tissue and damage DNA."},{"id":"l10-088","lecture":10,"topic":"Light","prompt":"What is photosynthetically active radiation?","choices":["Only infrared, above 2000 nm","Gamma rays, because they carry the most energy","Green wavelengths only, because that is what chlorophyll absorbs","About 400–700 nm, the same window as visible light"],"answer":3,"why":"Below red there is not enough energy to start the process. Above blue there is enough to tear molecules apart, which is bleaching. White light is a mix; a prism or a water drop spreads it. Violet and blue are shorter and higher energy; red is longer and lower energy."},{"id":"l10-089","lecture":10,"topic":"Pigments","prompt":"Why does a leaf look green?","choices":["Chlorophyll a absorbs blue and red light and reflects or transmits green","Chlorophyll a absorbs green and reflects blue and red","Carotenoids reflect green and absorb yellow, red, and orange","The stroma is a green pigment and chlorophyll is colorless"],"answer":0,"why":"A pigment absorbs a limited set of wavelengths and reflects or transmits the rest. The color you see is that remainder. Chlorophylls and carotenoids are the two major classes in plants and algae. This class focuses on chlorophyll a and b, which differ only slightly and sit in the thylakoid membrane. Carotenoids absorb in the blue and reflect yellow, orange, and red. In full sun they also dump excess energy as heat. Fruit colors such as lycopene and β-carotene advertise to animals that disperse seeds."},{"id":"l10-090","lecture":10,"topic":"Pigments","prompt":"Why do photosynthetic organisms keep a mix of pigments?","choices":["Extra pigments cancel chlorophyll so the leaf can rest","The mix absorbs a wider range of wavelengths than one pigment would","Each pigment absorbs every wavelength equally","Only plants standing in full sun have more than one pigment"],"answer":1,"why":"An absorption spectrum — the wavelengths a pigment actually absorbs — can identify it. Under water, or under a taller canopy, the light that arrives is not the full solar spectrum. Bacteriochlorophyll is the related pigment in bacteria. Chlorophylls named in class are a, b, c, d, and bacteriochlorophyll."},{"id":"l10-091","lecture":10,"topic":"Photosystems","prompt":"Why is Photosystem II numbered II if electrons flow through it first?","choices":["Photosystem I always runs before Photosystem II","Both sit in the stroma and contain no chlorophyll","The photosystems were named in the order they were discovered, not the order of electron flow","A photosystem is simply another name for rubisco"],"answer":2,"why":"A photosystem is a multiprotein complex in the thylakoid membrane that turns light into chemical energy. Antenna proteins bind the chlorophyll; each holds roughly 300–400 chlorophyll a and b molecules. The reaction center is where the chemistry happens. A photon is one packet of light energy."},{"id":"l10-092","lecture":10,"topic":"Photoact","prompt":"What actually moves from antenna chlorophyll to antenna chlorophyll?","choices":["The photon, which is stored as starch in the antenna","Electrons, hopping the whole way, so the reaction center never loses one","CO2, which is split at the antenna","Energy, until a special chlorophyll a in the reaction center gives up an electron"],"answer":3,"why":"Capture takes about a millionth of a second, and at first only energy has moved. The photoact is that special chlorophyll a giving up an electron while excited — the moment light becomes a captured electron. The rest of the light reactions get that electron onto NADPH for the Calvin cycle."},{"id":"l10-093","lecture":10,"topic":"Water splitting","prompt":"Why does photosynthesis require water?","choices":["Water is split to replace the electron Photosystem II loses; two waters make one O2","Water is split at Photosystem I to make NADPH directly","Water is the carbon source for glucose","Water accepts the electron at the end of the Calvin cycle"],"answer":0,"why":"After each photoact, Photosystem II has to be re-reduced. One H2O releases two electrons, two hydrogens, and one oxygen atom, but two waters are required for one O2. About 10% of that oxygen is used by the leaf’s own mitochondria; the rest goes to the atmosphere."},{"id":"l10-094","lecture":10,"topic":"Light reactions","prompt":"What is each photosystem mainly for?","choices":["PSII makes NADPH and PSI makes the sugar","PSII builds the proton gradient that makes ATP; PSI re-energizes the electron to make NADPH","Both photosystems make glucose directly","The proton gradient is built in the stroma and ATP synthase ignores it"],"answer":1,"why":"As the electron moves from PSII toward PSI it loses energy, and that energy pumps H+ from the stroma into the thylakoid lumen. Hydrogens from water-splitting join that gradient. ATP synthase later lets them out — chemiosmosis, as in respiration. PSI is oxidized and its electron is used to reduce NADP+ to NADPH. The two stay roughly in balance. ATP and NADPH last only millionths of a second; carbohydrates can last indefinitely."},{"id":"l10-095","lecture":10,"topic":"Calvin cycle","prompt":"Where does the Calvin cycle run, and what are its three stages?","choices":["In the thylakoid lumen: glycolysis, the Krebs cycle, then fermentation","In the stomata: regeneration only","In the stroma: fixation, reduction, then regeneration","In the mitochondrial matrix: fixation and nothing else"],"answer":2,"why":"CO2 comes in through stomata, crosses a short stretch of mesophyll, and reaches the stroma. RuBisCO joins CO2 to RuBP (three RuBP molecules in the lecture’s picture). Carbon fixation converts inorganic CO2 into organic molecules. Organic compounds contain carbon, and nearly all of them have C–H bonds."},{"id":"l10-096","lecture":10,"topic":"Calvin cycle","prompt":"What happens in reduction and regeneration?","choices":["RuBP is released as oxygen, and every G3P stays in the cycle forever","The Calvin cycle produces NADPH and Photosystem II consumes it","Three ATP are spent in fixation and none in regeneration","ATP and NADPH turn 3-PGA into G3P; one G3P leaves, and the rest are rebuilt into RuBP"],"answer":3,"why":"Fixation produces two molecules of 3-PGA. Reduction gives 3-PGA electrons: ATP becomes ADP, and NADPH loses energy and a hydrogen to become NADP+. Both go back to the light reactions. One G3P exits to the cytoplasm to build other compounds. Five G3P stay, and three ATP are used to regenerate RuBP so more CO2 can be fixed. RuBisCO’s full name is ribulose-1,5-bisphosphate carboxylase/oxygenase."},{"id":"l10-097","lecture":10,"topic":"C3, C4, CAM","prompt":"Which description matches C3 plants?","choices":["Most plants; efficient when it is cool, moist, and not overly bright; stomata open by day; oak and wheat","Stomata open only at night; cacti and agaves","Faster than C3 in high heat and high light, with corn as the example","They never use RuBisCO"],"answer":0,"why":"C3 plants need less machinery: fewer enzymes and no special anatomy. Open stomata in the daytime mean more water loss. They beat C4 and CAM under cool, moist, ordinary light."},{"id":"l10-098","lecture":10,"topic":"C3, C4, CAM","prompt":"What advantage do C4 plants have?","choices":["They open stomata only at night and include most oak trees","They photosynthesize faster than C3 plants in high light and high heat, and they lose less water","They are less water-efficient than C3 plants in every climate","They do not photosynthesize; they only respire"],"answer":1,"why":"CO2 is brought in faster, so the stomata need not stay open as long for the same carbon gain. They are open by day but can close once internal CO2 is high enough. The lecture puts C4 at more than 1,000 species, including corn and the big-four grasses."},{"id":"l10-099","lecture":10,"topic":"C3, C4, CAM","prompt":"How do CAM plants save water?","choices":["Stomata open widest at noon in the desert","They are the most efficient choice in a cool, wet forest","Stomata open at night and stay shut by day; cacti and agaves are the examples","They release methane instead of oxygen"],"answer":2,"why":"Night means no sun, cooler air, less wind, and less evaporation. In extreme drought a CAM plant can keep stomata closed night and day, using photosynthetic oxygen for respiration and respiratory CO2 for photosynthesis. Agave is the tequila example from class."},{"id":"l10-100","lecture":10,"topic":"Energy cycle","prompt":"Why do plants bother with cellular respiration if they photosynthesize?","choices":["Plants never respire","CO2 is a true waste that nothing can use again","Oxygen from photosynthesis cannot be used in respiration","They are alive and need ATP; photosynthesis builds the fuel, respiration spends it"],"answer":3,"why":"Atoms are conserved: they change form, they do not disappear. CO2 from respiration becomes glucose becomes biomass becomes CO2. CO2 is no more a waste of respiration than O2 is a waste of photosynthesis. On the butterfly-and-flower slide, both are alive and both have a metabolism. The flower is the photoautotroph. Both respire."}],"lectures":[{"id":7,"title":"Membrane","blurb":"Transport"},{"id":8,"title":"Metabolism","blurb":"Energy and enzymes"},{"id":9,"title":"Respiration","blurb":"Glucose to ATP"},{"id":10,"title":"Photosynthesis","blurb":"Light to sugar"}]};
const CARDS = DATA.cards;
const LECTURES = DATA.lectures;
const KEY = "lumen-cards-v1";
const LETTERS = ["A", "B", "C", "D"];

function esc(value) {
  return String(value).replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[ch]);
}

function load() {
  const base = { tags: {}, lectures: [7, 8, 9, 10], mode: "due" };
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || "null");
    if (!raw || typeof raw !== "object") return base;
    const lectures = Array.isArray(raw.lectures) ? raw.lectures.filter((n) => [7, 8, 9, 10].includes(n)) : [];
    const tags = {};
    if (raw.tags && typeof raw.tags === "object") {
      for (const [id, tag] of Object.entries(raw.tags)) {
        if ((tag === "known" || tag === "needs-work") && CARDS.some((card) => card.id === id)) tags[id] = tag;
      }
    }
    return {
      tags,
      lectures: lectures.length ? lectures : base.lectures,
      mode: raw.mode === "work" || raw.mode === "all" ? raw.mode : "due"
    };
  } catch {
    return base;
  }
}

let state = load();
let view = "lobby";
let queue = [];
let cursor = 0;
let picked = null;
let correct = 0;
let answered = 0;
let query = "";
let indexFilter = "all";
let armed = null;

function persist() { localStorage.setItem(KEY, JSON.stringify(state)); }
function shuffle(list) {
  const copy = list.slice();
  for (let i = copy.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = copy[i]; copy[i] = copy[j]; copy[j] = tmp;
  }
  return copy;
}
function inPool(card, mode) {
  if (!state.lectures.includes(card.lecture)) return false;
  const tag = state.tags[card.id];
  if (mode === "all") return true;
  if (mode === "work") return tag === "needs-work";
  return tag !== "known";
}
function counts() {
  let known = 0, work = 0, fresh = 0;
  for (const card of CARDS) {
    if (!state.lectures.includes(card.lecture)) continue;
    const tag = state.tags[card.id];
    if (tag === "known") known += 1;
    else if (tag === "needs-work") work += 1;
    else fresh += 1;
  }
  return { known, work, fresh, due: fresh + work, total: known + work + fresh };
}
function setTag(id, tag) {
  if (tag) state.tags[id] = tag;
  else delete state.tags[id];
  persist();
  draw();
}
function start(mode) {
  const next = shuffle(CARDS.filter((card) => inPool(card, mode)).map((card) => card.id));
  if (!next.length) return;
  queue = next; cursor = 0; picked = null; correct = 0; answered = 0; view = "study";
  draw();
}

function draw() {
  const root = document.getElementById("app");
  root.innerHTML = view === "study" ? studyHtml() : view === "done" ? doneHtml() : lobbyHtml();
}

function lobbyHtml() {
  const c = counts();
  const pool = CARDS.filter((card) => inPool(card, state.mode)).length;
  const lectures = LECTURES.map((lecture) => {
    const cards = CARDS.filter((card) => card.lecture === lecture.id);
    const known = cards.filter((card) => state.tags[card.id] === "known").length;
    const on = state.lectures.includes(lecture.id);
    return `<button class="chip${on ? " on" : ""}" data-act="lecture" data-id="${lecture.id}">${lecture.id} · ${esc(lecture.title)}<small>${esc(lecture.blurb)} · ${known}/${cards.length} known</small></button>`;
  }).join("");
  const modes = [
    ["due", "Hide known", "New cards and cards that need work"],
    ["work", "Needs work", "Only cards you flagged"],
    ["all", "Whole deck", "Includes cards you already know"]
  ].map(([id, label, hint]) => `<button class="mode${state.mode === id ? " on" : ""}" data-act="mode" data-id="${id}"><b>${label}</b><small>${hint}</small></button>`).join("");
  const filters = [["all", "All"], ["new", "New"], ["needs-work", "Needs work"], ["known", "Known"]]
    .map(([id, label]) => `<button class="pill${indexFilter === id ? " on" : ""}" data-act="filter" data-id="${id}">${label}</button>`).join("");
  const needle = query.trim().toLowerCase();
  const rows = CARDS.filter((card) => state.lectures.includes(card.lecture)).filter((card) => {
    const tag = state.tags[card.id];
    if (indexFilter === "known" || indexFilter === "needs-work") return tag === indexFilter;
    if (indexFilter === "new") return !tag;
    return true;
  }).filter((card) => (card.prompt + " " + card.topic + " " + card.why).toLowerCase().includes(needle))
    .map((card) => {
      const tag = state.tags[card.id] || "new";
      return `<li><div><p class="kicker">Lec ${card.lecture} · ${esc(card.topic)}</p><p>${esc(card.prompt)}</p></div>
        <select data-act="index-tag" data-id="${card.id}" aria-label="Mark ${esc(card.prompt)}">
          <option value="new"${tag === "new" ? " selected" : ""}>New</option>
          <option value="needs-work"${tag === "needs-work" ? " selected" : ""}>Needs work</option>
          <option value="known"${tag === "known" ? " selected" : ""}>Known</option>
        </select></li>`;
    }).join("") || `<li>No cards match that search.</li>`;
  const note = pool === 0
    ? (state.mode === "work" ? "No cards are marked needs work in this lecture filter." : "Every card in this filter is marked known. Clear those marks, or shuffle the whole deck.")
    : (state.mode === "due" ? c.known + (c.known === 1 ? " known card stays out of this shuffle." : " known cards stay out of this shuffle.")
      : state.mode === "all" ? "Known cards are included this time." : "Only needs-work cards are in this shuffle.");
  return `
    <header style="display:flex;gap:1rem">
      <span class="mark" aria-hidden="true"><i style="background:#1f6a45"></i><i style="background:#6a5226"></i><i style="background:#1c2430"></i></span>
      <div>
        <p class="kicker">BIOL 1414</p>
        <h1 style="font-size:2.6rem;margin:0.2rem 0">Lumen Cards</h1>
        <p class="muted" style="margin:0;max-width:40rem">Lectures 7–10. Answer the card, see whether you were right, then mark it. The next shuffle leaves known cards out.</p>
      </div>
    </header>
    <div class="stats">
      <div class="sheet stat"><b>${c.due}</b><span>Still in play</span></div>
      <div class="sheet stat"><b>${c.known}</b><span>Known</span></div>
      <div class="sheet stat"><b>${c.work}</b><span>Needs work</span></div>
    </div>
    <button class="primary" data-act="shuffle" ${pool === 0 ? "disabled" : ""}>${pool === 0 ? "Nothing to shuffle" : "Shuffle " + pool + " cards"}</button>
    <p class="tiny">${esc(note)}</p>
    <section class="sheet">
      <h2 style="margin:0 0 .6rem;font-size:1.2rem">Lectures</h2>
      <div class="row">${lectures}</div>
      <h2 style="margin:1rem 0 .6rem;font-size:1.2rem">What the shuffle includes</h2>
      <div class="row" style="flex-direction:column">${modes}</div>
    </section>
    <section class="sheet">
      <div class="bar">
        <h2 style="margin:0;font-size:1.2rem">Card index</h2>
        <div class="row">
          <button class="ghost" data-act="release">${armed === "known" ? "Confirm release" : "Release known"}</button>
          <button class="ghost" data-act="reset">${armed === "all" ? "Confirm reset" : "Reset all marks"}</button>
        </div>
      </div>
      <label for="q">Search the ${c.total} cards in this filter</label>
      <input id="q" value="${esc(query)}" placeholder="Try NADH, stomata, tonicity…" data-act="search">
      <div class="row" style="margin-top:.6rem">${filters}</div>
      <ul class="index">${rows}</ul>
    </section>`;
}

function studyHtml() {
  const card = CARDS.find((item) => item.id === queue[cursor]);
  const graded = picked !== null;
  const right = graded && picked === card.answer;
  const choices = card.choices.map((choice, index) => {
    const cls = !graded ? "" : index === card.answer ? " right" : index === picked ? " wrong" : " dim";
    return `<button class="choice${cls}" data-act="choice" data-id="${index}" ${graded ? "disabled" : ""}><span class="let">${LETTERS[index]}</span><span>${esc(choice)}</span></button>`;
  }).join("");
  const tag = state.tags[card.id];
  const feedback = graded ? `
    <div class="verdict ${right ? "ok" : "no"}" role="status">
      <p class="word">${right ? "Correct" : "Incorrect"}</p>
      ${right ? "" : `<p>The answer is ${esc(card.choices[card.answer])}.</p>`}
    </div>
    <p class="why">${esc(card.why)}</p>
    <div class="tags">
      <button class="tag ghost${tag === "known" ? " on-known" : ""}" data-act="known">Known</button>
      <button class="tag ghost${tag === "needs-work" ? " on-work" : ""}" data-act="work">Needs work</button>
    </div>
    <p class="tiny">Known cards stay out of the next shuffle. Needs-work cards stay in. Press again to clear a mark.</p>
    <button class="ink" data-act="next">${cursor + 1 >= queue.length ? "Finish shuffle" : "Next card"}</button>` : `<p class="tiny">Pick one answer.</p>`;
  const pct = Math.round(((cursor + (graded ? 1 : 0)) / queue.length) * 100);
  return `
    <div class="bar">
      <button class="ghost" data-act="deck">Deck</button>
      <p class="tiny" style="margin:0">Card ${cursor + 1} of ${queue.length}${answered ? " · " + correct + "/" + answered + " correct" : ""}</p>
      <button class="ghost" data-act="reshuffle">New shuffle</button>
    </div>
    <div class="meter" aria-hidden="true"><span style="width:${pct}%"></span></div>
    <div class="stack"><article class="sheet card">
      <p class="kicker">Lecture ${card.lecture} · ${esc(card.topic)}</p>
      <h2 class="prompt">${esc(card.prompt)}</h2>
      ${choices}
      ${feedback}
    </article></div>`;
}

function doneHtml() {
  const c = counts();
  const remaining = CARDS.filter((card) => inPool(card, "due")).length;
  return `<section class="sheet" style="padding:1.5rem">
    <p class="kicker">Shuffle finished</p>
    <h1 style="font-size:2.4rem;margin:.3rem 0">${correct} of ${answered} correct</h1>
    <p class="muted">${c.known} ${c.known === 1 ? "card is" : "cards are"} marked known and will be left out of the next shuffle. ${remaining > 0 ? remaining + " still in play." : "Nothing unmarked is left in this lecture filter."}</p>
    ${remaining > 0 ? `<button class="primary" data-act="again">Shuffle what’s left</button>` : `<button class="primary" data-act="include">Shuffle again, including known</button>`}
    <button class="ghost" style="width:100%;margin-top:.5rem" data-act="deck">Back to the deck</button>
  </section>`;
}

document.getElementById("app").addEventListener("click", (event) => {
  const btn = event.target.closest("[data-act]");
  if (!btn || btn.dataset.act === "search" || btn.dataset.act === "index-tag") return;
  const act = btn.dataset.act;
  if (act === "shuffle") start(state.mode);
  if (act === "lecture") {
    const id = Number(btn.dataset.id);
    const has = state.lectures.includes(id);
    const lectures = has ? state.lectures.filter((n) => n !== id) : state.lectures.concat(id).sort((a, b) => a - b);
    if (lectures.length) { state.lectures = lectures; persist(); draw(); }
  }
  if (act === "mode") { state.mode = btn.dataset.id; persist(); draw(); }
  if (act === "filter") { indexFilter = btn.dataset.id; draw(); const input = document.getElementById("q"); if (input) input.focus(); }
  if (act === "release") {
    if (armed !== "known") { armed = "known"; draw(); return; }
    armed = null;
    for (const id of Object.keys(state.tags)) if (state.tags[id] === "known") delete state.tags[id];
    persist(); draw();
  }
  if (act === "reset") {
    if (armed !== "all") { armed = "all"; draw(); return; }
    armed = null; state.tags = {}; persist(); draw();
  }
  if (act === "choice" && picked === null) {
    picked = Number(btn.dataset.id);
    answered += 1;
    const card = CARDS.find((item) => item.id === queue[cursor]);
    if (picked === card.answer) correct += 1;
    draw();
  }
  if (act === "known" || act === "work") {
    const card = CARDS.find((item) => item.id === queue[cursor]);
    const tag = act === "known" ? "known" : "needs-work";
    setTag(card.id, state.tags[card.id] === tag ? null : tag);
  }
  if (act === "next") {
    if (cursor + 1 >= queue.length) view = "done";
    else { cursor += 1; picked = null; }
    draw();
  }
  if (act === "reshuffle") start(state.mode);
  if (act === "deck") { view = "lobby"; draw(); }
  if (act === "again") start("due");
  if (act === "include") { state.mode = "all"; persist(); start("all"); }
});

document.getElementById("app").addEventListener("input", (event) => {
  const el = event.target;
  if (el.dataset.act === "search") { query = el.value; draw(); const input = document.getElementById("q"); if (input) { input.focus(); input.setSelectionRange(query.length, query.length); } }
  if (el.dataset.act === "index-tag") {
    setTag(el.dataset.id, el.value === "new" ? null : el.value);
  }
});

document.addEventListener("keydown", (event) => {
  const tag = event.target && event.target.tagName;
  if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
  if (view !== "study") return;
  if (picked === null && ["1", "2", "3", "4"].includes(event.key)) {
    picked = Number(event.key) - 1;
    answered += 1;
    const card = CARDS.find((item) => item.id === queue[cursor]);
    if (picked === card.answer) correct += 1;
    draw();
  } else if (picked !== null && (event.key === "n" || event.key === "N" || event.key === "Enter")) {
    event.preventDefault();
    if (cursor + 1 >= queue.length) view = "done";
    else { cursor += 1; picked = null; }
    draw();
  } else if (picked !== null && (event.key === "k" || event.key === "K" || event.key === "w" || event.key === "W")) {
    const card = CARDS.find((item) => item.id === queue[cursor]);
    const mark = event.key.toLowerCase() === "k" ? "known" : "needs-work";
    setTag(card.id, state.tags[card.id] === mark ? null : mark);
  }
});

draw();
</script>
</body>
</html>
