<style>
  :root {
    --paper: #f3eee4;
    --card: #fbf8f2;
    --ink: #1c2430;
    --muted: #3e4942;
    --line: #e3d9c8;
    --green: #1f6a45;
    --green-soft: #e4f2ea;
    --rust: #9c3d28;
    --rust-soft: #f8ebe6;
    --brass: #6a5226;
    --brass-soft: #f3ead6;
  }
  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    margin: 0;
    font-family: Outfit, "Avenir Next", system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.5;
  }
  h1, h2 { font-family: Fraunces, Georgia, serif; text-wrap: balance; font-weight: 560; }
  button, select { font: inherit; cursor: pointer; }
  button:disabled { cursor: default; }
  main { max-width: 48rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
  .kicker { letter-spacing: 0.14em; text-transform: uppercase; color: var(--brass); font-size: 0.75rem; font-weight: 600; margin: 0; }
  .muted { color: var(--muted); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin: 1rem 0; }
  .sheet {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 1rem;
    box-shadow: 0 1px 0 var(--line), 0 16px 40px rgba(28, 36, 48, 0.06);
  }
  .stat { padding: 0.75rem; }
  .stat b { display: block; font-family: Fraunces, Georgia, serif; font-size: 1.8rem; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 0.75rem; color: var(--muted); }
  .primary, .ink, .ghost, .choice, .tag {
    min-height: 3rem;
    border-radius: 0.75rem;
    border: 1px solid transparent;
  }
  .primary { width: 100%; background: var(--green); color: var(--paper); font-weight: 600; }
  .primary:disabled { opacity: 0.5; }
  .ink { width: 100%; background: var(--ink); color: var(--paper); font-weight: 600; }
  .ghost { background: var(--paper); border-color: var(--line); color: var(--ink); padding: 0 0.75rem; }
  .row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .chip { min-height: 3rem; border-radius: 0.75rem; border: 1px solid var(--line); background: var(--paper); color: var(--ink); text-align: left; padding: 0.4rem 0.75rem; }
  .chip.on, .pill.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .mode { width: 100%; text-align: left; padding: 0.45rem 0.75rem; border-radius: 0.75rem; border: 1px solid var(--line); background: var(--paper); }
  .mode.on { border-color: var(--green); background: var(--green-soft); }
  .mode small, .chip small { display: block; color: var(--muted); font-size: 0.75rem; }
  .chip.on small { color: var(--paper); }
  section.sheet { padding: 1rem; margin-top: 1rem; }
  label { display: block; font-size: 0.875rem; color: var(--muted); margin-top: 0.75rem; }
  input, select { min-height: 2.75rem; border: 1px solid var(--line); border-radius: 0.75rem; background: var(--paper); color: var(--ink); padding: 0 0.75rem; }
  input { width: 100%; }
  .index { max-height: 24rem; overflow: auto; display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.75rem; padding: 0; list-style: none; }
  .index li { display: flex; gap: 0.75rem; align-items: flex-start; border: 1px solid var(--line); border-radius: 0.75rem; padding: 0.75rem; background: var(--paper); }
  .index p { margin: 0; font-size: 0.875rem; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .meter { height: 0.4rem; background: var(--line); border-radius: 999px; overflow: hidden; }
  .meter span { display: block; height: 100%; background: var(--green); }
  .stack { position: relative; margin-top: 0.5rem; }
  .stack::before { content: ""; position: absolute; inset: -0.45rem 0.75rem 0.4rem; border: 1px solid var(--line); background: var(--brass-soft); border-radius: 1rem; }
  .card { position: relative; padding: 1.25rem; }
  .prompt { font-size: 1.5rem; margin: 0.6rem 0 1rem; }
  .choice { width: 100%; display: flex; gap: 0.75rem; align-items: flex-start; text-align: left; padding: 0.75rem; margin-top: 0.5rem; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
  .choice .let { width: 1.7rem; height: 1.7rem; flex: none; display: grid; place-items: center; border-radius: 0.4rem; background: var(--brass-soft); font-weight: 600; }
  .choice.right { border-color: var(--green); background: var(--green-soft); }
  .choice.wrong { border-color: var(--rust); background: var(--rust-soft); }
  .choice.dim { opacity: 0.6; }
  .verdict { border-radius: 0.75rem; padding: 0.8rem 1rem; color: var(--paper); margin-top: 1rem; }
  .verdict.ok { background: var(--green); }
  .verdict.no { background: var(--rust); }
  .verdict p { margin: 0; }
  .verdict .word { font-family: Fraunces, Georgia, serif; font-size: 1.5rem; }
  .why { font-size: 0.95rem; }
  .tags { display: grid; gap: 0.5rem; margin-top: 0.75rem; }
  @media (min-width: 640px) { .tags { grid-template-columns: 1fr 1fr; } .prompt { font-size: 1.85rem; } }
  .tag.on-known { background: var(--green); color: var(--paper); }
  .tag.on-work { background: var(--rust); color: var(--paper); }
  .pill { border-radius: 999px; min-height: 2.75rem; padding: 0 0.8rem; border: 1px solid var(--line); background: var(--paper); }
  .tiny { font-size: 0.75rem; color: var(--muted); }
  .mark { width: 2rem; display: flex; flex-direction: column; gap: 0.25rem; margin-top: 0.4rem; }
  .mark i { display: block; height: 0.35rem; border-radius: 999px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
